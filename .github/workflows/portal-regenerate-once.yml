name: Regenerate portal once
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portal-regenerate-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.number == 20 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/historical-archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/portal.mjs
          git diff --exit-code -- public/archiv-erweiterung public/data
          node tests/portal-links.mjs
          git add public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Regenerate portal navigation and sitemap'
          git push origin HEAD:refs/heads/feature/historical-archive
