name: Bulk historical archive
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/full-historical-bulk-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch all 73 historical revisions
        run: |
          mkdir -p bulk-sources
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,time,pathlib
          seasons=[(str(y),f'Tschammerpokal {y}') for y in range(1936,1944)]+[(f'{y}-{(y+1)%100:02}',f'DFB-Pokal {y}/{(y+1)%100:02}') for y in range(1953,2018)]
          for key,title in seasons:
              if '1955-56' <= key <= '1962-63': title=f'DFB-Pokal {int(key[:4])+1}'
              if key=='1999-00': title='DFB-Pokal 1999/2000'
              url='https://de.wikipedia.org/w/api.php?'+urllib.parse.urlencode(dict(action='parse',page=title,prop='wikitext|revid',redirects=1,format='json',formatversion=2))
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PokalRadar archive research/1.0 (https://github.com/PuntaCanada/PokalRadar)'})
                  with urllib.request.urlopen(req,timeout=20) as r: data=r.read(5000001)
                  if len(data)>5000000: raise ValueError('oversize')
                  obj=json.loads(data)
                  assert obj.get('parse',{}).get('revid')
                  pathlib.Path('bulk-sources',key+'.json').write_bytes(data)
              except Exception as e: print(key,str(e))
              time.sleep(0.5)
          PY
      - name: Generate actual historical archive and sitemap
        run: |
          node scripts/bulk-history.mjs bulk-sources
          node scripts/portal.mjs
          git diff --exit-code -- public/data public/archiv-erweiterung/1935 public/archiv-erweiterung/1952-53 public/archiv-erweiterung/2025-26 public/archiv-erweiterung/2026-27
          node tests/portal-links.mjs
          git add public docs/bulk-history-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import historical season records and regenerate portal'
          git push origin HEAD:refs/heads/feature/full-historical-bulk-import
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-history-report
          path: |
            docs/bulk-history-report.json
            bulk-sources
          retention-days: 3
