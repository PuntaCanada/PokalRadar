name: Data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: node -e "const s=require('./public/data/seasons.json'); if(s.length!==7 || s.reduce((n,x)=>n+x.matches.length,0)!==441) process.exit(1)"
