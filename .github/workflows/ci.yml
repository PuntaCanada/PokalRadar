name: Data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: node -e "const s=require('./public/data/seasons.json'); if(s.length!==7 || s.reduce((n,x)=>n+x.matches.length,0)!==441) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-seasons
          path: public/data/seasons.json
      - name: Persist validated data once on project branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/data-foundation'
        run: |
          if git ls-files --error-unmatch public/data/seasons.json >/dev/null 2>&1; then
            git diff --exit-code -- public/data/seasons.json
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/seasons.json
            git commit -m 'Persist validated historical data for Cloudflare'
            git push origin HEAD:refs/heads/feature/data-foundation
          fi
