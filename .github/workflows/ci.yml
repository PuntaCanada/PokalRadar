name: Data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: node -e "const s=require('./public/data/seasons.json'); if(s.length!==7 || s.reduce((n,x)=>n+x.matches.length,0)!==441) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-seasons
          path: public/data/seasons.json
      - name: Verify committed JSON is deterministic
        run: |
          git ls-files --error-unmatch public/data/seasons.json
          git diff --exit-code -- public/data/seasons.json
