name: Data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Regenerate all static pages from a clean output set
        run: |
          find public -name index.html -type f -delete
          rm -f public/sitemap.xml public/robots.txt
          node scripts/portal.mjs
      - name: Save regenerated production files
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/market-readiness' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate market-ready portal'
            git push origin HEAD:fix/market-readiness
          fi
      - name: Verify all committed production files
        run: |
          git diff --exit-code -- public
          test -z "$(git ls-files --others -- public)"
          test -z "$(git ls-files --deleted -- public)"
      - run: node tests/portal-links.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - run: node tests/market-review.mjs
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/market-readiness'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/market-readiness'
        with:
          name: market-review
          path: visual-review
      - uses: actions/upload-artifact@v4
        with:
          name: generated-portal
          path: public
