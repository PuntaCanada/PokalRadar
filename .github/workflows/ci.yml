name: Data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Regenerate all static pages from a clean output set
        run: |
          find public -name index.html -type f -delete
          rm -f public/sitemap.xml public/robots.txt
          node scripts/portal.mjs
      - run: node tests/portal-links.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: generated-portal
          path: public
      - name: Persist validated pages once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/2018-second-2019-first'
        run: |
          git add public
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Persist validated historical pages'
            git push origin HEAD:refs/heads/feature/2018-second-2019-first
          fi
