name: Data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- public/data/seasons.json
      - run: node scripts/portal.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: generated-portal
          path: public
      - name: Check existing production independently
        continue-on-error: true
        run: |
          curl -fsSL --max-time 20 https://pokalradar.pages.dev/ -o /tmp/pokal-index
          curl -fsSL --max-time 20 https://pokalradar.pages.dev/data/seasons.json -o /tmp/pokal-data
          sha256sum /tmp/pokal-data public/data/seasons.json
          cmp /tmp/pokal-data public/data/seasons.json
