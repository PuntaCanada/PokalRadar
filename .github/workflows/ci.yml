name: Data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Regenerate all static pages from a clean output set
        run: |
          find public -path public/archiv-erweiterung -prune -o -name index.html -type f -exec rm {} +
          rm -f public/sitemap.xml public/robots.txt
          node scripts/portal.mjs
      - name: Verify all committed production files
        run: |
          git diff --exit-code -- public
          test -z "$(git ls-files --others -- public)"
          test -z "$(git ls-files --deleted -- public)"
      - run: node tests/portal-links.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: generated-portal
          path: public
