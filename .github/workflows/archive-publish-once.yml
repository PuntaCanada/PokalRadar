name: Generate archive from pinned snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/archive-publish-once.yml'
permissions:
  contents: write
  actions: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/historical-archive' && github.event.pull_request.number == 20
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/PuntaCanada/PokalRadar/actions/artifacts/15139182595/zip > /tmp/archive.zip
          echo '28158ea84d6aaac6420d3caa105e71e8e9843cf35e8f8b9e7f21f7d17561aa03  /tmp/archive.zip' | sha256sum -c -
          unzip -q /tmp/archive.zip -d /tmp/archive-sources
      - name: Generate and inspect actual records
        run: |
          node scripts/archive-publish.mjs /tmp/archive-sources
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('public/archiv-erweiterung')
          counts={}
          for p in root.glob('*/matches.json'):
              s=json.loads(p.read_text()); rows=s['matches']
              assert len({r['id'] for r in rows})==len(rows)
              assert all(r['home'] and r['away'] and r['home']!=r['away'] for r in rows)
              counts[s['season']]=len(rows)
          assert counts['2025-26']==63 and counts['2026-27']==56
          assert len(counts)==4
          print(counts)
          PY
          git diff --exit-code -- public/data/seasons.json
      - name: Save generated files to PR branch only
        run: |
          git add public/archiv-erweiterung
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate supplemental archive from pinned source snapshot'
          git push origin HEAD:refs/heads/feature/historical-archive
